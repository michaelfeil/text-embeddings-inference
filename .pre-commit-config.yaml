repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
        # Preserve upstream bytes recorded in retained source provenance.
        exclude: ^backends/libtorch/cpp/(vendor/torch_flash_attention/|fixtures/[^/]+/LICENSE(?:[.-][^/]+)?$)
    -   id: trailing-whitespace
        exclude: ^(docs/source/basic_tutorials/launcher\.md$|backends/libtorch/cpp/vendor/torch_flash_attention/)
-   repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
    -   id: fmt
    -   id: cargo-check
    -   id: clippy
